aid: bambusa-therapeutics
name: Bambusa Therapeutics
description: 'Bambusa Therapeutics, Inc. is a clinical-stage biotechnology company headquartered in the
  Boston Seaport, founded in 2024 by Shanshan Xu and Helmut Jeggle to develop next-generation bispecific
  antibodies for immunological and inflammatory (I&I) diseases. Its antibody-engineering platform combines
  half-life extension with high-concentration subcutaneous delivery, and its pipeline spans dermatology,
  respiratory, gastroenterology and rheumatology — led by BBT-001 (IL-31 x IL-4Ralpha, in a Phase 1b/2a
  atopic dermatitis trial) and BBT-002 for COPD. The company raised a Series Seed in 2024, an approximately
  $90M Series A led by RA Capital Management in February 2025, and an oversubscribed Series A-2 in November
  2025. It is a therapeutics developer, not a software vendor, and publishes no public API, SDK or developer
  program.'
